<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cotizaciones y Comparativas · Meta</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%231f3864'/><path d='M8 22V10l8 7 8-7v12' stroke='white' stroke-width='3' fill='none' stroke-linejoin='round'/></svg>">
<style>
:root{
  --bg:#f4f5f8; --panel:#fff; --ink:#1b2030; --muted:#6a7186; --line:#e2e5ec; --line2:#eef0f4;
  --brand:#1f3864; --brand2:#2f5597; --brand-soft:#e8eef8;
  --ok:#137a43; --ok-soft:#e3f4ea; --warn:#a35f00; --warn-soft:#fff3dc; --bad:#b4232c; --bad-soft:#fde8e9;
  --radius:10px; --shadow:0 1px 2px rgba(20,30,60,.06),0 4px 14px rgba(20,30,60,.05);
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif; font-size:14px; color:var(--ink);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12151c; --panel:#1a1e28; --ink:#e7e9ef; --muted:#9aa1b4; --line:#2c3242; --line2:#232837;
  --brand:#8fb0ea; --brand2:#6d93d8; --brand-soft:#22304a;
  --ok:#4cc584; --ok-soft:#173326; --warn:#f0b354; --warn-soft:#3a2d14; --bad:#f17b82; --bad-soft:#3d1c20;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink)}
a{color:var(--brand2);text-decoration:none} a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
/* top bar */
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:18px;padding:0 20px;height:54px;background:var(--brand);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) header.top{background:#0d1526}}
header.top .logo{font-weight:700;letter-spacing:.2px;white-space:nowrap}
header.top nav{display:flex;gap:2px;overflow-x:auto}
header.top nav a{color:#cfdaf0;padding:8px 12px;border-radius:7px;white-space:nowrap}
header.top nav a.on,header.top nav a:hover{background:rgba(255,255,255,.14);color:#fff;text-decoration:none}
header.top .who{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:12.5px;color:#cfdaf0;white-space:nowrap}
header.top .who button{background:rgba(255,255,255,.12);border:0;color:#fff;padding:5px 10px;border-radius:6px;cursor:pointer}
.demo-badge{background:#f0b354;color:#3a2600;font-weight:600;padding:2px 8px;border-radius:20px;font-size:11.5px}
main{padding:20px;max-width:1700px;margin:0 auto}
h1{font-size:20px;margin:0 0 4px} h2{font-size:16px;margin:0 0 10px} .sub{color:var(--muted);font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:16px}
.btn{border:1px solid var(--line);background:var(--panel);padding:7px 13px;border-radius:7px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--brand2)}
.btn.pri{background:var(--brand2);border-color:var(--brand2);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:3px 8px;font-size:12.5px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
input.in,select.in,textarea.in{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:7px 10px;min-width:0}
input.in:focus,select.in:focus,textarea.in:focus{outline:2px solid var(--brand-soft);border-color:var(--brand2)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
label.f > *{font-size:14px;color:var(--ink)}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.kpi .l{font-size:12px;color:var(--muted)} .kpi .v{font-size:22px;font-weight:650;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted)}
/* tables */
.tw{overflow:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);max-height:calc(100vh - 230px)}
table.t{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
table.t th{position:sticky;top:0;z-index:2;background:var(--brand-soft);color:var(--ink);text-align:left;font-weight:600;font-size:12px;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:6px 8px;border-bottom:1px solid var(--line2);vertical-align:middle}
table.t tr:hover td{background:rgba(47,85,151,.04)}
table.t tr.click{cursor:pointer}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.c,th.c{text-align:center}
td.wrap{white-space:normal;min-width:260px;max-width:340px}
.muted{color:var(--muted)} .small{font-size:12px}
.pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--line2);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--brand-soft);color:var(--brand2)}
.ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)}
table.t input.cell{width:84px;border:1px solid transparent;background:transparent;border-radius:5px;padding:3px 5px;text-align:right;font-variant-numeric:tabular-nums}
table.t input.cell.w{width:110px} table.t input.cell.t{text-align:left;width:150px}
table.t input.cell:hover{border-color:var(--line)} table.t input.cell:focus{border-color:var(--brand2);background:var(--panel);outline:none}
.intel{line-height:1.25}
.intel b{font-variant-numeric:tabular-nums}
/* drawer / modal */
.overlay{position:fixed;inset:0;background:rgba(10,15,30,.38);z-index:40;display:flex;justify-content:flex-end}
.overlay.center{justify-content:center;align-items:flex-start;padding-top:8vh}
.drawer{width:min(760px,100%);height:100%;background:var(--panel);overflow:auto;padding:20px;box-shadow:-10px 0 30px rgba(0,0,0,.15)}
.modal{width:min(640px,94%);max-height:84vh;overflow:auto;background:var(--panel);border-radius:12px;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.x{float:right;background:none;border:0;font-size:22px;cursor:pointer;color:var(--muted);line-height:1}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1b2030;color:#fff;padding:10px 16px;border-radius:8px;z-index:60;font-size:13.5px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
#toast.on{opacity:1}
.login{max-width:360px;margin:12vh auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:26px;box-shadow:var(--shadow)}
.login h1{margin-bottom:16px}
.login .in{width:100%;margin-bottom:10px}
.drop{border:2px dashed var(--line);border-radius:10px;padding:22px;text-align:center;color:var(--muted);cursor:pointer}
.drop:hover,.drop.on{border-color:var(--brand2);color:var(--brand2);background:var(--brand-soft)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.bar{height:8px;border-radius:5px;background:var(--line2);overflow:hidden;min-width:80px}
.bar > i{display:block;height:100%;background:var(--brand2)}
.legend{font-size:12px;color:var(--muted);margin:8px 2px 0}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--brand2);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}

/* ===== Planilla tipo Excel ===== */
.xlwrap{display:flex;flex-direction:column;background:#fff;border:1px solid #c8c8c8;border-radius:6px 6px 0 0;overflow:hidden;color:#222;font-family:Calibri,"Segoe UI",Arial,sans-serif}
.xlbar{display:flex;align-items:center;gap:0;border-bottom:1px solid #d4d4d4;background:#fff;height:30px}
.xlref{width:84px;text-align:center;font-size:13px;border-right:1px solid #d4d4d4;height:100%;display:flex;align-items:center;justify-content:center;color:#333}
.xlfx{width:34px;text-align:center;color:#888;font-style:italic;font-family:Georgia,serif;border-right:1px solid #d4d4d4;height:100%;display:flex;align-items:center;justify-content:center}
.xlfbox{flex:1;border:0;height:100%;padding:0 8px;font:13px Consolas,"Cascadia Mono",monospace;outline:none;background:#fff;color:#222}
.xlfbox[readonly]{color:#555;background:#fafafa}
.xl{position:relative;overflow:auto;outline:none;background:#fff}
.xlt{border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:13px}
.xlt th,.xlt td{height:22px;padding:0 5px;border-right:1px solid #e1e1e1;border-bottom:1px solid #e1e1e1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:21px}
.xlt thead th{position:sticky;background:#f3f3f3;color:#444;font-weight:400;z-index:4;border-color:#d0d0d0}
.xlt thead tr.xll th{top:0;text-align:center;font-size:12px;height:20px;line-height:19px}
.xlt thead tr.xlh th{top:21px;font-weight:600;font-size:12px;height:36px;line-height:15px;white-space:normal;vertical-align:bottom;padding-bottom:3px;cursor:pointer;position:sticky}
.xlt thead tr.xlf th{top:58px;padding:0;height:22px}
.xlt thead tr.xlf input{width:100%;height:21px;border:0;background:#fffef0;font:12px Calibri,"Segoe UI",sans-serif;padding:0 4px;outline:none;color:#222}
.xlt thead tr.xlf input::placeholder{color:#c4c4c4}
.xlt thead th.on{background:#d3f0e0;color:#185c37;border-bottom:2px solid #217346}
.xlt thead th.xltitle.calc{background:#eef3fa}
.xlt thead th.xltitle.live{background:#fdf1d6}
.xlt th.xlcorner{position:sticky;left:0;z-index:8!important;background:#e9e9e9}
.xlt th.xlrn{position:sticky;left:0;z-index:3;background:#f3f3f3;color:#555;font-weight:400;text-align:center;font-size:12px;cursor:default}
.xlt th.xlrn.on{background:#d3f0e0;color:#185c37;border-right:2px solid #217346}
.xlt td{background:#fff;cursor:cell}
.xlt td.num{text-align:right;font-variant-numeric:tabular-nums}
.xlt td.calc{background:#f7f9fc}
.xlt td.live{background:#fffaf0}
.xlt td.xlfz,.xlt th.xlfz{border-right:2px solid #b9b9b9}
.xlt td.in{background-image:linear-gradient(rgba(33,115,70,.13),rgba(33,115,70,.13))}
.xlt td.cur{outline:2px solid #217346;outline-offset:-2px}
.xlt td.ghost{background:#fbfbfb;color:#b0b0b0;font-style:italic}
.xlt td.sp{padding:0;border:0;height:auto}
.xlt td .g{color:#999}
.xlt td.ok{color:#137a43} .xlt td.warn{color:#a35f00} .xlt td.bad{color:#c0262f} .xlt td.b{font-weight:700}
.xlt td.best{background:#d8f2df!important;color:#0f5c2e;font-weight:700}
.xlt td.prop{font-weight:700;color:#1f3864}
.xlt tr.grp td{border-top:1.5px solid #9fb6d8}
.rz{position:absolute;right:-3px;top:0;width:7px;height:100%;cursor:col-resize;z-index:5}
.xled{position:absolute;display:none;z-index:9;border:2px solid #217346;padding:0 4px;font:13px Calibri,"Segoe UI",sans-serif;text-align:right;outline:none;background:#fff;color:#222;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.xled.left{text-align:left}
.xlstatus{display:flex;justify-content:space-between;gap:20px;padding:3px 12px;background:#f3f3f3;border-top:1px solid #d4d4d4;font-size:12px;color:#444;min-height:22px;white-space:pre}
.xltabs{display:flex;align-items:stretch;gap:1px;background:#e6e6e6;border:1px solid #c8c8c8;border-top:0;border-radius:0 0 6px 6px;overflow-x:auto;padding:0 6px;font-family:Calibri,"Segoe UI",sans-serif}
.xltabs a{padding:5px 14px;font-size:13px;color:#333;white-space:nowrap;border-bottom:3px solid transparent;text-decoration:none}
.xltabs a:hover{background:#f4f4f4;text-decoration:none}
.xltabs a.on{background:#fff;color:#185c37;font-weight:600;border-bottom-color:#217346}
.xltabs .sep{width:1px;background:#bbb;margin:5px 6px}
.xlmenu{position:fixed;z-index:70;background:#fff;border:1px solid #c8c8c8;box-shadow:0 6px 18px rgba(0,0,0,.18);padding:4px 0;min-width:220px;font-size:13px;color:#222;font-family:Calibri,"Segoe UI",sans-serif}
.xlmenu div{padding:6px 16px;cursor:pointer} .xlmenu div:hover{background:#e8f3ec} .xlmenu div.danger{color:#c0262f}
.xlmenu hr{border:0;border-top:1px solid #e3e3e3;margin:4px 0}
.xltop{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.xltop .ttl{font-size:18px;font-weight:650}
.xlhelp{font-size:12px;color:var(--muted);margin-top:6px}
.xlhelp kbd{background:var(--panel);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:11px}
main.full{max-width:none;padding:12px 14px}

.xltools{display:flex;align-items:center;gap:2px;padding:3px 6px;background:#f8f8f8;border-bottom:1px solid #d4d4d4;flex-wrap:wrap}
.xltools button{border:1px solid transparent;background:transparent;border-radius:4px;height:26px;min-width:28px;padding:0 6px;cursor:pointer;font:13px Calibri,"Segoe UI",sans-serif;color:#222;position:relative}
.xltools button:hover{background:#e6e6e6;border-color:#d0d0d0}
.xltools button.on{background:#d3f0e0;border-color:#217346}
.xltools .xlsep{width:1px;height:20px;background:#d0d0d0;margin:0 5px}
.xltools .xlsplit{display:inline-flex}
.xltools .xlsplit button:first-child{border-top-right-radius:0;border-bottom-right-radius:0;padding-bottom:5px}
.xltools .xlsplit .dd{min-width:16px;padding:0 3px;font-size:10px;border-top-left-radius:0;border-bottom-left-radius:0}
.xltools .sw{position:absolute;left:5px;right:5px;bottom:3px;height:4px;border-radius:1px;border:1px solid rgba(0,0,0,.15)}
.xltools .ico{font-size:13px}
.xlpop{position:fixed;z-index:80;background:#fff;border:1px solid #c8c8c8;box-shadow:0 6px 18px rgba(0,0,0,.18);padding:6px;min-width:200px;font:13px Calibri,"Segoe UI",sans-serif;color:#222}
.xlpt{font-size:12px;color:#666;padding:2px 4px 6px}
.xlpal{display:grid;grid-template-columns:repeat(10,18px);gap:3px;padding:0 4px 6px}
.xlpal i{width:18px;height:18px;border:1px solid #ccc;cursor:pointer;display:block}
.xlpal i:hover{outline:2px solid #217346;outline-offset:0}
.xlpo{display:flex;align-items:center;gap:6px;padding:5px 8px;cursor:pointer}
.xlpo:hover{background:#e8f3ec}
.xlpo input[type=color]{width:28px;height:20px;border:0;padding:0;background:none}
.xl.painting td{cursor:copy}
@media (max-width:700px){main{padding:12px} header.top{padding:0 10px;gap:8px} header.top .logo span{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script src="config.js"></script>
<script src="lib/supabase.js"></script>
<script src="lib/xlsx.full.min.js"></script>
<script src="parsers.js"></script>
<script src="grid.js"></script>
<script src="app.js"></script>
</body>
</html>
