<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arche Salud · Meta</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230f5c55'/><path d='M9 23l7-14 7 14M12 18h8' stroke='white' stroke-width='3' fill='none' stroke-linejoin='round' stroke-linecap='round'/></svg>">
<style>
:root{
  --bg:#f3f6f6; --panel:#fff; --ink:#18232a; --muted:#647079; --line:#dfe5e6; --line2:#edf1f1;
  --brand:#0f5c55; --brand2:#167a70; --brand-soft:#e2f1ee;
  --ok:#137a43; --ok-soft:#e3f4ea; --warn:#a35f00; --warn-soft:#fff3dc; --bad:#b4232c; --bad-soft:#fde8e9;
  --gold:#b26b00; --gold-soft:#fff4e0;
  --radius:10px; --shadow:0 1px 2px rgba(20,40,40,.06),0 4px 14px rgba(20,40,40,.05);
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif; font-size:14px; color:var(--ink);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111717; --panel:#192122; --ink:#e6ecec; --muted:#97a4a6; --line:#2b3638; --line2:#212b2c;
  --brand:#7fd1c4; --brand2:#5cbcae; --brand-soft:#1d3532;
  --ok:#4cc584; --ok-soft:#173326; --warn:#f0b354; --warn-soft:#3a2d14; --bad:#f17b82; --bad-soft:#3d1c20;
  --gold:#f3b85a; --gold-soft:#3a2c12;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink)}
a{color:var(--brand2);text-decoration:none} a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:18px;padding:0 20px;height:54px;background:#0f5c55;color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) header.top{background:#0b2b28}}
header.top .logo{font-weight:700;letter-spacing:.2px;white-space:nowrap}
header.top .logo small{font-weight:400;opacity:.75;margin-left:6px}
header.top nav{display:flex;gap:2px;overflow-x:auto}
header.top nav a{color:#cfe9e4;padding:8px 12px;border-radius:7px;white-space:nowrap}
header.top nav a.on,header.top nav a:hover{background:rgba(255,255,255,.15);color:#fff;text-decoration:none}
header.top .who{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:12.5px;color:#cfe9e4;white-space:nowrap}
header.top .who button,header.top .who a.ext{background:rgba(255,255,255,.12);border:0;color:#fff;padding:5px 10px;border-radius:6px;cursor:pointer}
.demo-badge{background:#f0b354;color:#3a2600;font-weight:600;padding:2px 8px;border-radius:20px;font-size:11.5px}
main{padding:20px;max-width:1500px;margin:0 auto}
h1{font-size:20px;margin:0 0 4px} h2{font-size:16px;margin:0 0 10px} .sub{color:var(--muted);font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:16px}
.btn{border:1px solid var(--line);background:var(--panel);padding:7px 13px;border-radius:7px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--brand2)}
.btn.pri{background:var(--brand2);border-color:var(--brand2);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.big{padding:11px 20px;font-size:15px;font-weight:600}
.btn.sm{padding:3px 8px;font-size:12.5px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
input.in,select.in,textarea.in{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:7px 10px;min-width:0}
input.in:focus,select.in:focus,textarea.in:focus{outline:2px solid var(--brand-soft);border-color:var(--brand2)}
input.in.xl{font-size:18px;padding:10px 12px;width:100%}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
label.f > *{font-size:14px;color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.kpi .l{font-size:12px;color:var(--muted)} .kpi .v{font-size:22px;font-weight:650;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted)}
.tw{overflow:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);max-height:calc(100vh - 240px)}
table.t{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
table.t th{position:sticky;top:0;z-index:2;background:var(--brand-soft);color:var(--ink);text-align:left;font-weight:600;font-size:12px;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:6px 8px;border-bottom:1px solid var(--line2);vertical-align:middle}
table.t tr:hover td{background:rgba(22,122,112,.05)}
table.t tr.click{cursor:pointer}
table.t th.sticky1,table.t td.sticky1{position:sticky;left:0;background:var(--panel);z-index:1}
table.t th.sticky1{z-index:3;background:var(--brand-soft)}
table.t.pres-r tr > :last-child{position:sticky;right:0;background:var(--panel);box-shadow:-1px 0 0 var(--line);z-index:1}
table.t.pres-r thead tr > :last-child{background:var(--brand-soft);z-index:3}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.c,th.c{text-align:center}
td.nw{white-space:nowrap}
td.zero{color:var(--line)}
.muted{color:var(--muted)} .small{font-size:12px}
.pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--line2);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--brand-soft);color:var(--brand2)}
.ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)}
select.cell{border:1px solid transparent;background:transparent;border-radius:5px;padding:2px 4px;cursor:pointer}
select.cell:hover{border-color:var(--line)}
select.cell.si{color:var(--ok);font-weight:600} select.cell.no{color:var(--bad)}
input.cell{border:1px solid transparent;background:transparent;border-radius:5px;padding:3px 5px;width:100%;min-width:120px}
input.cell:hover{border-color:var(--line)} input.cell:focus{border-color:var(--brand2);background:var(--panel);outline:none}
/* nuevo pedido */
.np{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,.85fr);gap:16px;align-items:start}
@media (max-width:980px){.np{grid-template-columns:1fr}}
.step{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand2);margin:2px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 10px;cursor:pointer;text-align:left;line-height:1.2;min-width:110px}
.chip:hover{border-color:var(--brand2)}
.chip.on{background:var(--brand2);border-color:var(--brand2);color:#fff}
.chip .d{font-weight:700;font-size:14.5px}
.chip .p{font-size:11.5px;opacity:.8;margin-top:2px;font-variant-numeric:tabular-nums}
.chip .u{font-size:10.5px;opacity:.65}
.fam{margin-bottom:10px}
.fam .fl{font-size:12px;color:var(--muted);margin:0 0 4px;font-weight:600}
.auto{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.auto label.f input,.auto label.f select{width:100%}
.price{border-radius:var(--radius);background:var(--gold-soft);border:1px solid color-mix(in srgb,var(--gold) 30%,transparent);padding:16px}
.price .big{font-size:34px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums;line-height:1.1}
.price .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.price dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:14px 0 0;font-size:13.5px}
.price dt{color:var(--muted)} .price dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.hist{font-size:12.5px;color:var(--muted);margin-top:6px}
.hist b{color:var(--ink)}
.sug{position:absolute;left:0;right:0;top:100%;z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.15);max-height:320px;overflow:auto;margin-top:4px}
.sug div{padding:7px 10px;cursor:pointer;border-bottom:1px solid var(--line2)}
.sug div:hover,.sug div.on{background:var(--brand-soft)}
.sug small{color:var(--muted)}
.rel{position:relative}
.overlay{position:fixed;inset:0;background:rgba(10,20,20,.38);z-index:40;display:flex;justify-content:center;align-items:flex-start;padding-top:6vh}
.modal{width:min(720px,94%);max-height:88vh;overflow:auto;background:var(--panel);border-radius:12px;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.x{float:right;background:none;border:0;font-size:22px;cursor:pointer;color:var(--muted);line-height:1}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#18232a;color:#fff;padding:10px 16px;border-radius:8px;z-index:60;font-size:13.5px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
#toast.on{opacity:1}
.login{max-width:360px;margin:12vh auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:26px;box-shadow:var(--shadow)}
.login h1{margin-bottom:16px}
.login .in{width:100%;margin-bottom:10px}
.drop{border:2px dashed var(--line);border-radius:10px;padding:22px;text-align:center;color:var(--muted);cursor:pointer}
.drop:hover,.drop.on{border-color:var(--brand2);color:var(--brand2);background:var(--brand-soft)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--brand2);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.tabsm{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.tabsm a{padding:4px 10px;border-radius:6px;border:1px solid var(--line);background:var(--panel);font-size:12.5px;color:var(--ink)}
.tabsm a.on{background:var(--brand2);color:#fff;border-color:var(--brand2);text-decoration:none}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:12px}
@media (max-width:700px){main{padding:12px} header.top{padding:0 10px;gap:8px;height:auto;flex-wrap:wrap;padding-top:8px} header.top .logo small,header.top .who span,header.top .who a.ext{display:none} header.top nav{order:3;width:100%;padding-bottom:6px} header.top .who{margin-left:auto}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script src="config.js"></script>
<script src="lib/supabase.js"></script>
<script src="lib/xlsx.full.min.js"></script>
<script src="app.js?v=20261016b"></script>
</body>
</html>
